name: opac-production
services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
  web:
    build: .
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set the private Atlas URI}
      MONGODB_DB: ${MONGODB_DB:-opac_labs}
      MONGODB_TRANSACTIONS: "true"
      BETTER_AUTH_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random auth secret}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_PROVIDER: caddy
      OPAC_PAID_AI_ENABLED: "false"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
volumes:
  caddy-data:
  caddy-config:
