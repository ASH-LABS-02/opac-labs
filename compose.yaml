services:
  emulators:
    build:
      context: .
      dockerfile: Dockerfile.emulators
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9099:9099"
    volumes:
      - firebase-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    image: opac-labs-web:local
    build:
      context: .
      args:
        NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-opac-labs
      FIRESTORE_EMULATOR_HOST: emulators:8080
      FIREBASE_AUTH_EMULATOR_HOST: emulators:9099
      GCLOUD_PROJECT: demo-opac-labs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      emulators:
        condition: service_healthy
  admin:
    build:
      context: ./admin-app
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_FIREBASE_API_KEY: demo-key
      VITE_FIREBASE_AUTH_DOMAIN: localhost
      VITE_FIREBASE_PROJECT_ID: demo-opac-labs
      VITE_FIREBASE_STORAGE_BUCKET: demo-opac-labs.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      VITE_FIREBASE_APP_ID: "1:123456789:web:local"
      VITE_USE_FIREBASE_EMULATORS: "true"
      VITE_FIREBASE_EMULATOR_HOST: 127.0.0.1
    depends_on:
      emulators:
        condition: service_healthy
  admin-bootstrap:
    image: opac-labs-web:local
    command: ["node", "scripts/bootstrap-admin.mjs"]
    environment:
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-opac-labs
      FIRESTORE_EMULATOR_HOST: emulators:8080
      FIREBASE_AUTH_EMULATOR_HOST: emulators:9099
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    depends_on:
      emulators:
        condition: service_healthy
    profiles: ["setup"]
volumes:
  firebase-data:
