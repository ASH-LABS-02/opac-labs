name: opac-local
services:
  web:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      MONGODB_URI: mongodb://opac:${MONGO_LOCAL_PASSWORD:-opac-local-only-password}@mongo:27017/opac_labs?authSource=admin
      MONGODB_DB: opac_labs
      MONGODB_TRANSACTIONS: "false"
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-only-secret-change-before-deployment-73b2}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_ALLOW_INSECURE_LOCAL: "true"
      EMAIL_FROM: OPAC Labs <local@opac.test>
      OPAC_PAID_AI_ENABLED: "false"
    depends_on:
      mongo: { condition: service_healthy }
      mailpit: { condition: service_started }
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: opac
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_LOCAL_PASSWORD:-opac-local-only-password}
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.getSiblingDB('admin').auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD);db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"]
volumes:
  mongo-data:
